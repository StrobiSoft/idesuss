name: Validate webapp locales

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app/index.html'
      - 'app/*.json.txt'
      - 'app/profile-bridge*.js'
      - 'app/language-options.js'
      - 'js/menu/**'
      - 'js/shared/**'
      - 'js/lang/modules/auth/lang/auth.js'
      - 'radio/**'
      - 'admin/**'
      - 'messages/**'
      - 'supabase/**'
      - 'server/radio-proxy/**'
      - 'server/security/**'
      - 'server/password-security/**'
      - 'tools/mock-hibp-server.mjs'
      - 'tools/validate-password-security-gateway.mjs'
      - 'server/security/**'
      - 'server/password-security/**'
      - 'tools/mock-hibp-server.mjs'
      - 'tools/validate-radio-dev-audio.mjs'
      - 'tools/validate-radio-dev-audio.mjs'
      - 'tools/validate-webapp-locales.mjs'
      - 'tools/validate-nickname-normalization.mjs'
      - 'tools/validate-resolver-vectors.mjs'
      - 'tools/validate-common-webapp-locales.mjs'
      - 'tools/validate-root-auth-profile-single-path.mjs'
      - 'tools/validate-messaging-web-integration.mjs'
      - 'tools/validate-final-web-shell.mjs'
      - 'tools/fixtures/common-webapp-locale-manifest.json'
      - 'tools/fixtures/resolver-vectors.json'
      - 'js/resolver.js'
      - '.github/workflows/validate-webapp-locales.yml'
  push:
    paths:
      - 'index.html'
      - 'app/index.html'
      - 'app/*.json.txt'
      - 'app/profile-bridge*.js'
      - 'app/language-options.js'
      - 'js/menu/**'
      - 'js/shared/**'
      - 'js/lang/modules/auth/lang/auth.js'
      - 'radio/**'
      - 'admin/**'
      - 'messages/**'
      - 'supabase/**'
      - 'server/radio-proxy/**'
      - 'server/security/**'
      - 'server/password-security/**'
      - 'tools/mock-hibp-server.mjs'
      - 'tools/validate-password-security-gateway.mjs'
      - 'tools/validate-webapp-locales.mjs'
      - 'tools/validate-nickname-normalization.mjs'
      - 'tools/validate-resolver-vectors.mjs'
      - 'tools/validate-common-webapp-locales.mjs'
      - 'tools/validate-root-auth-profile-single-path.mjs'
      - 'tools/fixtures/common-webapp-locale-manifest.json'
      - 'tools/fixtures/resolver-vectors.json'
      - 'js/resolver.js'
      - '.github/workflows/validate-webapp-locales.yml'

permissions:
  contents: read

concurrency:
  group: validate-webapp-locales-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate webapp locale parity and bridge wiring
        run: node tools/validate-webapp-locales.mjs
      - name: Validate common-generated webapp locale parity
        run: node tools/validate-common-webapp-locales.mjs
      - name: Validate nickname normalization parity
        run: node tools/validate-nickname-normalization.mjs
      - name: Validate resolver parity vectors
        run: node tools/validate-resolver-vectors.mjs
      - name: Validate profile bridge runtime ordering
        run: node tools/validate-profile-bridge-runtime.mjs
      - name: Validate single root auth/profile path
        run: node tools/validate-root-auth-profile-single-path.mjs
      - name: Validate messaging web integration
        run: node tools/validate-messaging-web-integration.mjs
      - name: Validate final web shell
        run: node tools/validate-final-web-shell.mjs
      - name: Validate password security gateway integration
        run: node tools/validate-password-security-gateway.mjs
      - name: Validate shared module syntax
        run: |
          node --check app/profile-bridge.js
          node --check app/profile-bridge-entry.js
          node --check app/language-options.js
          node --check js/shared/auth-service.js
          node --check js/pwa-register.js
          node --check js/shared/profile-service.js
          node --check js/shared/language-preference.js
          node --check js/shared/shell-language.js
          node --check js/shared/supabase-client.js
          node --check js/shared/password-security-service.js
          node --check js/lang/home-language.js
          node --check js/lang/modules/Home/lang/hu.js
          node --check js/lang/modules/Home/lang/en.js
          node --check js/lang/modules/Home/lang/nl.js
          node --check js/lang/modules/Home/lang/ro.js
          node --check js/lang/modules/Home/lang/pl.js
          node --check js/lang/modules/Home/lang/hr.js
          node --check js/lang/modules/Home/lang/be.js
          node --check js/menu/auth-shell.js
          node --check js/menu/auth-controller.js
          node --check js/menu/profile.js
          node --check js/menu/menu-core.js
          node --check js/menu/settings.js
          node --check messages/messages.js
          node --check messages/messages-language.js
          node --check js/lang/modules/auth/lang/auth.js
      - name: Validate radio module syntax
        run: |
          node --check radio/radio-engine.js
          node --check radio/radio-entitlements.js
          node --check radio/radio-stations.js
          node --check radio/radio-language.js
          node --check radio/radio-app.js
          node --check rules/rules-language.js
          node --check ideas/ideas-language.js
      - name: Validate generated radio development audio
        run: node tools/validate-radio-dev-audio.mjs

      - name: Validate server security module syntax
        run: |
          node --check server/security/spy-trap.js
          node --check server/password-security/server.js
          node --check tools/mock-hibp-server.mjs

      - name: Validate password security gateway and Spy Trap
        env:
          HOST: 127.0.0.1
        run: |
          set -euo pipefail

          PORT=8791 MOCK_HIBP_COMPROMISED_PASSWORD=password node tools/mock-hibp-server.mjs >/tmp/mock-hibp.log 2>&1 &
          hibp_pid=$!

          NODE_ENV=test \
          HOST=127.0.0.1 \
          PORT=8790 \
          IDESUSS_HIBP_BASE_URL=http://127.0.0.1:8791 \
          IDESUSS_PASSWORD_ALLOWED_ORIGIN=https://idesuss.net \
          IDESUSS_PASSWORD_RATE_MAX=50 \
          node server/password-security/server.js >/tmp/password-security.log 2>&1 &
          gateway_pid=$!

          cleanup() {
            kill "$gateway_pid" "$hibp_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8790/healthz >/tmp/password-health.json; then
              ready=true
              break
            fi
            sleep 0.2
          done
          test "$ready" = true
          grep -q '"ok":true' /tmp/password-health.json

          safe_candidate='NeverLogThisCandidate-42!'
          safe_code=$(curl --silent --output /tmp/password-safe.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Origin: https://idesuss.net' \
            --data "{\"password\":\"$safe_candidate\"}" \
            http://127.0.0.1:8790/v1/security/password/check)
          test "$safe_code" = "200"
          grep -q '"ok":true' /tmp/password-safe.json
          grep -q '"compromised":false' /tmp/password-safe.json

          compromised_code=$(curl --silent --output /tmp/password-compromised.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Origin: https://idesuss.net' \
            --data '{"password":"password"}' \
            http://127.0.0.1:8790/v1/security/password/check)
          test "$compromised_code" = "200"
          grep -q '"compromised":true' /tmp/password-compromised.json
          grep -q '"known_compromised_password"' /tmp/password-compromised.json

          bad_origin=$(curl --silent --output /tmp/password-origin.json --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Origin: https://evil.example' \
            --data '{"password":"AnotherCandidate-42!"}' \
            http://127.0.0.1:8790/v1/security/password/check)
          test "$bad_origin" = "403"

          first=$(curl --silent --output /tmp/password-spy1.json --write-out '%{http_code}' http://127.0.0.1:8790/.env)
          second=$(curl --silent --output /tmp/password-spy2.json --write-out '%{http_code}' http://127.0.0.1:8790/.env)
          third=$(curl --silent --output /tmp/password-spy3.json --write-out '%{http_code}' http://127.0.0.1:8790/.env)
          fourth=$(curl --silent --output /tmp/password-spy4.json --write-out '%{http_code}' http://127.0.0.1:8790/.env)
          test "$first" = "403"
          test "$second" = "403"
          test "$third" = "403"
          test "$fourth" = "403"
          grep -q '"security_escalation"' /tmp/password-spy4.json

          if grep -F "$safe_candidate" /tmp/password-security.log; then
            echo "Plaintext password leaked into gateway log" >&2
            exit 1
          fi

      - name: Validate radio proxy syntax
        run: node --check server/radio-proxy/server.js

      - name: Validate radio proxy API and Spy Trap
        env:
          HOST: 127.0.0.1
          PORT: 8787
          IDESUSS_RADIO_HLS_SECRET: ci-test-secret-not-production
          IDESUSS_RADIO_CORS_ORIGIN: https://idesuss.net
          IDESUSS_RADIO_STATIONS_JSON: '{"test-radio":{"name":"Test Radio","sourceUrl":"https://example.com:444/live.mp3","locales":["en"]}}'
        run: |
          set -euo pipefail
          node server/radio-proxy/server.js >/tmp/radio-proxy.log 2>&1 &
          proxy_pid=$!
          cleanup() {
            kill "$proxy_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/tmp/health.json; then
              ready=true
              break
            fi
            sleep 0.25
          done
          test "$ready" = true
          grep -q '"ok":true' /tmp/health.json

          curl --fail --silent 'http://127.0.0.1:8787/v1/radio/catalog?locale=en' >/tmp/catalog.json
          grep -q '"test-radio"' /tmp/catalog.json

          cors=$(curl --silent --dump-header - --output /dev/null http://127.0.0.1:8787/healthz | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
          test "$cors" = "https://idesuss.net"

          method=$(curl --silent --request POST --output /tmp/post.json --write-out '%{http_code}' http://127.0.0.1:8787/healthz)
          missing=$(curl --silent --output /tmp/missing.json --write-out '%{http_code}' http://127.0.0.1:8787/v1/radio/stream/does-not-exist)
          test "$method" = "405"
          test "$missing" = "404"
          grep -q '"method_not_allowed"' /tmp/post.json
          grep -q '"unknown_station"' /tmp/missing.json

          first=$(curl --silent --output /tmp/spy1.json --write-out '%{http_code}' http://127.0.0.1:8787/.env)
          second=$(curl --silent --output /tmp/spy2.json --write-out '%{http_code}' http://127.0.0.1:8787/.env)
          third=$(curl --silent --output /tmp/spy3.json --write-out '%{http_code}' http://127.0.0.1:8787/.env)
          fourth=$(curl --silent --output /tmp/spy4.json --write-out '%{http_code}' http://127.0.0.1:8787/.env)
          test "$first" = "404"
          test "$second" = "403"
          test "$third" = "403"
          test "$fourth" = "403"
          grep -q '"not_found"' /tmp/spy1.json
          grep -q '"access_denied"' /tmp/spy2.json
          grep -q '"access_denied"' /tmp/spy3.json
          grep -q '"security_escalation"' /tmp/spy4.json

      - name: Show server security logs on failure
        if: failure()
        run: |
          cat /tmp/password-security.log 2>/dev/null || true
          cat /tmp/mock-hibp.log 2>/dev/null || true
          cat /tmp/radio-proxy.log 2>/dev/null || true
