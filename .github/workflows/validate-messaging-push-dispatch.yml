name: Validate messaging push dispatcher

on:
  push:
    paths:
      - 'supabase/functions/messaging-push-dispatch/**'
      - 'supabase/messaging-push-dispatch.sql'
      - 'tools/validate-messaging-push-dispatch.mjs'
      - '.github/workflows/validate-messaging-push-dispatch.yml'
  pull_request:
    paths:
      - 'supabase/functions/messaging-push-dispatch/**'
      - 'supabase/messaging-push-dispatch.sql'
      - 'tools/validate-messaging-push-dispatch.mjs'
      - '.github/workflows/validate-messaging-push-dispatch.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/validate-messaging-push-dispatch.mjs
