name: Remove GEN1 root auth profile

on:
  push:
    branches:
      - refactor/root-auth-profile-single-path-2026-09-16

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove duplicate GEN1 root auth/profile
        run: node tools/remove-gen1-root-auth-profile.mjs
      - name: Commit generated cleanup when needed
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor(auth): remove duplicate GEN1 root auth/profile"
          git push
