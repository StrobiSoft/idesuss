name: Validate radio proxy

on:
  pull_request:
    paths:
      - 'server/radio-proxy/**'
      - '.github/workflows/validate-radio-proxy.yml'
  push:
    paths:
      - 'server/radio-proxy/**'
      - '.github/workflows/validate-radio-proxy.yml'

permissions:
  contents: read

jobs:
  validate-radio-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check Node syntax
        working-directory: server/radio-proxy
        run: npm run check

      - name: Start proxy on Node 20
        env:
          HOST: 127.0.0.1
          PORT: 8787
          IDESUSS_RADIO_HLS_SECRET: ci-test-secret
          IDESUSS_RADIO_CORS_ORIGIN: https://idesuss.net
          IDESUSS_RADIO_STATIONS_JSON: '{"test-radio":{"name":"Test Radio","sourceUrl":"https://example.com:444/live.mp3","locales":["en"]}}'
        run: |
          node server/radio-proxy/server.js >/tmp/radio-proxy.log 2>&1 &
          echo $! >/tmp/radio-proxy.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/healthz >/tmp/health.json; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8787/healthz | grep -q '"ok":true'
          curl --fail --silent 'http://127.0.0.1:8787/v1/radio/catalog?locale=en' | grep -q '"test-radio"'

      - name: Verify Spy Trap escalation
        run: |
          first=$(curl --silent --output /tmp/spy1.json --write-out '%{http_code}' http://127.0.0.1:8787/.env)
          second=$(curl --silent --output /tmp/spy2.json --write-out '%{http_code}' http://127.0.0.1:8787/.env)
          third=$(curl --silent --output /tmp/spy3.json --write-out '%{http_code}' http://127.0.0.1:8787/.env)
          fourth=$(curl --silent --output /tmp/spy4.json --write-out '%{http_code}' http://127.0.0.1:8787/.env)

          test "$first" = "404"
          test "$second" = "403"
          test "$third" = "403"
          test "$fourth" = "403"

          grep -q '"not_found"' /tmp/spy1.json
          grep -q '"access_denied"' /tmp/spy2.json
          grep -q '"access_denied"' /tmp/spy3.json
          grep -q '"security_escalation"' /tmp/spy4.json

      - name: Verify standard API behavior
        run: |
          method=$(curl --silent --request POST --output /tmp/post.json --write-out '%{http_code}' http://127.0.0.1:8787/healthz)
          missing=$(curl --silent --output /tmp/missing.json --write-out '%{http_code}' http://127.0.0.1:8787/v1/radio/stream/does-not-exist)

          test "$method" = "405"
          test "$missing" = "404"
          grep -q '"method_not_allowed"' /tmp/post.json
          grep -q '"unknown_station"' /tmp/missing.json

      - name: Show proxy log on failure
        if: failure()
        run: cat /tmp/radio-proxy.log || true

      - name: Stop proxy
        if: always()
        run: |
          if [ -f /tmp/radio-proxy.pid ]; then
            kill "$(cat /tmp/radio-proxy.pid)" 2>/dev/null || true
          fi
