<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Idesüss — Chat</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17324d;background:#f4f7fb}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f8fbff,#eef4fb)}
    .shell{width:min(980px,calc(100% - 24px));margin:0 auto;padding:24px 0 40px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .back{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:#e7f0ff;color:#0d5bd7;cursor:pointer}
    .brand{font-weight:900;font-size:1.25rem}.card{background:#fff;border:1px solid #d7e0ea;border-radius:24px;box-shadow:0 18px 44px rgba(22,44,77,.10);overflow:hidden}
    .head{padding:22px;border-bottom:1px solid #e4ebf3}.head h1{margin:0 0 6px;font-size:1.7rem}.head p{margin:0;color:#5e748d}
    .layout{display:grid;grid-template-columns:220px 1fr;min-height:560px}.rooms{padding:14px;border-right:1px solid #e4ebf3;background:#f8fbff}.room{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:11px 12px;margin-bottom:8px;background:#fff;color:#17324d;font-weight:750;cursor:pointer}.room.active{background:#0d5bd7;color:#fff}
    .chat{display:flex;flex-direction:column}.messages{flex:1;padding:20px;display:flex;flex-direction:column;gap:12px}.msg{max-width:78%;padding:12px 14px;border-radius:16px;background:#eef4fb}.msg.me{align-self:flex-end;background:#dceaff}.composer{display:flex;gap:10px;padding:16px;border-top:1px solid #e4ebf3}.composer input{flex:1;min-width:0;border:1px solid #ccd8e5;border-radius:14px;padding:12px 14px;font:inherit}.composer button{border:0;border-radius:14px;padding:12px 18px;background:#0d5bd7;color:#fff;font-weight:800;cursor:pointer}
    .note{font-size:.88rem;color:#6b7d92;margin-top:12px}
    @media(max-width:720px){.layout{grid-template-columns:1fr}.rooms{border-right:0;border-bottom:1px solid #e4ebf3;display:flex;gap:8px;overflow:auto}.room{width:auto;white-space:nowrap;margin:0}.messages{min-height:360px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand">Idesüss™</div><button class="back" onclick="location.href='../'">← Főoldal</button></div>
    <section class="card" aria-label="Idesüss Chat">
      <div class="head"><h1>💬 Chat</h1><p>Az Idesüss közösségi beszélgetési felülete.</p></div>
      <div class="layout">
        <nav class="rooms" aria-label="Szobák">
          <button class="room active">Általános</button>
          <button class="room">Off topic</button>
          <button class="room">Filmajánló</button>
          <button class="room">Zene</button>
          <button class="room">Segítség</button>
        </nav>
        <div class="chat">
          <div class="messages" id="messages">
            <div class="msg">A chat felülete már elérhető. A valós idejű backend bekötése a következő fejlesztési lépés.</div>
          </div>
          <form class="composer" id="composer">
            <input id="messageInput" autocomplete="off" placeholder="Írj egy üzenetet…" />
            <button type="submit">Küldés</button>
          </form>
        </div>
      </div>
    </section>
    <div class="note">Fejlesztői előnézet — az üzenetek ezen a képernyőn még csak helyben jelennek meg.</div>
  </main>
  <script>
    document.getElementById('composer').addEventListener('submit', function (event) {
      event.preventDefault();
      const input = document.getElementById('messageInput');
      const value = input.value.trim();
      if (!value) return;
      const message = document.createElement('div');
      message.className = 'msg me';
      message.textContent = value;
      document.getElementById('messages').appendChild(message);
      input.value = '';
      message.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  </script>
</body>
</html>
