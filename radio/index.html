<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Idesüss — Rádió</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17324d;background:#f4f7fb}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(180deg,#f8fbff,#eef4fb)}
    .shell{width:min(900px,calc(100% - 24px));margin:0 auto;padding:24px 0 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-weight:900;font-size:1.25rem}.back{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:#e7f0ff;color:#0d5bd7;cursor:pointer}
    .card{background:#fff;border:1px solid #d7e0ea;border-radius:24px;box-shadow:0 18px 44px rgba(22,44,77,.10);padding:22px}.card h1{margin:0 0 8px}.muted{color:#5e748d}.player{margin-top:20px;padding:18px;border-radius:18px;background:linear-gradient(135deg,#0f49d8,#3b82f6);color:#fff}.now{font-size:1.2rem;font-weight:850;margin-bottom:6px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.controls button{border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#0d5bd7}.secondary{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28)!important}.stations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.station{border:1px solid #d7e0ea;border-radius:16px;padding:14px;background:#f8fbff;cursor:pointer}.station strong{display:block;margin-bottom:4px}.note{margin-top:14px;font-size:.88rem;color:#6b7d92}@media(max-width:640px){.stations{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand">Idesüss™</div><button class="back" onclick="location.href='../'">← Főoldal</button></div>
    <section class="card">
      <h1>📻 Rádió</h1>
      <p class="muted">Az Idesüss rádiófelületének első használható váza.</p>
      <div class="player">
        <div class="now" id="nowPlaying">Nincs kiválasztott állomás</div>
        <div id="stationInfo">Válassz egy állomást a listából.</div>
        <div class="controls">
          <button class="primary" id="playBtn" type="button">▶ Lejátszás</button>
          <button class="secondary" id="stopBtn" type="button">■ Leállítás</button>
        </div>
      </div>
      <div class="stations">
        <button class="station" data-name="Idesüss Radio 1" data-info="Mintaállomás — stream bekötés előtt"><strong>Idesüss Radio 1</strong><span class="muted">Mintaállomás</span></button>
        <button class="station" data-name="Idesüss Radio 2" data-info="Mintaállomás — stream bekötés előtt"><strong>Idesüss Radio 2</strong><span class="muted">Mintaállomás</span></button>
      </div>
      <div class="note">Fejlesztői előnézet — valódi streamforrás még nincs bekötve, így ez jelenleg a kezelőfelület váza.</div>
    </section>
  </main>
  <script>
    let selected = null;
    document.querySelectorAll('.station').forEach(function(button){
      button.addEventListener('click', function(){
        selected = button.dataset.name;
        document.getElementById('nowPlaying').textContent = selected;
        document.getElementById('stationInfo').textContent = button.dataset.info;
      });
    });
    document.getElementById('playBtn').addEventListener('click', function(){
      document.getElementById('stationInfo').textContent = selected ? 'A lejátszás akkor indulhat, amikor streamforrást kötünk az állomáshoz.' : 'Előbb válassz állomást.';
    });
    document.getElementById('stopBtn').addEventListener('click', function(){
      document.getElementById('stationInfo').textContent = 'Lejátszás leállítva.';
    });
  </script>
</body>
</html>
