# Dedicated public endpoint for the Password Security Gateway on VM 101.
# Static idesuss.net remains hosted by GitHub Pages.
# DNS prerequisite: security.idesuss.net must resolve to the public endpoint
# forwarded to VM101. TLS certificate files must exist before enabling this site.
#
# Nginx standard access logs do not record request bodies. Do not add
# $request_body or any body-capturing debug/log directive here.

server {
    listen 80;
    listen [::]:80;
    server_name security.idesuss.net;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://security.idesuss.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name security.idesuss.net;

    ssl_certificate /etc/letsencrypt/live/security.idesuss.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/security.idesuss.net/privkey.pem;

    client_max_body_size 16k;

    location = /v1/security/password/check {
        proxy_pass http://127.0.0.1:8790/v1/security/password/check;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_request_buffering on;
        proxy_buffering on;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8790/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
