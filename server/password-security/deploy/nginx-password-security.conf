# Include inside the idesuss.net HTTPS server block on VM 101.
# Nginx standard access logs do not record request bodies. Do not add
# $request_body or body-capturing debug directives to this location.

location = /api/security/password/check {
    proxy_pass http://127.0.0.1:8790/v1/security/password/check;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    client_max_body_size 16k;
    proxy_request_buffering on;
    proxy_buffering on;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location = /api/security/password/healthz {
    proxy_pass http://127.0.0.1:8790/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    add_header Cache-Control "no-store" always;
}
