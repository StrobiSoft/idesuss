<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Idesüss™ — Üzenetek</title>
  <meta name="theme-color" content="#07111f" />
  <link rel="icon" href="/favicon.png" />
  <style>
    :root{--bg:#06111f;--panel:#102033;--panel2:#0b1827;--line:#294967;--text:#f5f8fc;--muted:#9db2c7;--accent:#4da3ff;--ok:#4ade80;--danger:#f87171;--warn:#f6c453}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,rgba(77,163,255,.15),transparent 30%),linear-gradient(180deg,#0b1727,var(--bg))}
    button,input,textarea{font:inherit} button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .shell{width:min(1200px,calc(100% - 24px));margin:0 auto;padding:20px 0 40px}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    .brand{font-weight:900}.nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav a,.tab,.action{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);color:var(--text);padding:10px 13px;font-weight:800}
    .tabs{display:flex;gap:8px;margin-bottom:14px}.tab.active{background:#0d5bd7;border-color:#4da3ff}
    .panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(18,37,59,.96),rgba(10,25,40,.96));box-shadow:0 24px 70px rgba(0,0,0,.3)}
    .messages-layout{display:grid;grid-template-columns:330px 1fr;min-height:650px;overflow:hidden}
    .threads{border-right:1px solid var(--line);padding:12px;overflow:auto}
    .thread{width:100%;text-align:left;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--text);padding:12px;margin-bottom:8px}
    .thread:hover,.thread.active{background:rgba(255,255,255,.06);border-color:var(--line)}
    .thread-top{display:flex;justify-content:space-between;gap:8px}.thread-name{font-weight:900}.muted{color:var(--muted)}
    .unread{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#0d5bd7;font-weight:900}
    .conversation{display:grid;grid-template-rows:auto 1fr auto;min-width:0}
    .conversation-head{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:900}
    .messages{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
    .bubble{max-width:78%;padding:10px 12px;border-radius:16px;background:#142a42;border:1px solid #294967}
    .bubble.mine{align-self:flex-end;background:#0d3d75}.bubble.system{align-self:stretch;max-width:none;background:#182638;border-style:dashed}
    .message-meta{font-size:.75rem;color:var(--muted);margin-top:5px}.friend-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .friend-actions button{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#0b1929;color:var(--text);font-weight:800}
    .friend-actions .yes{background:#155c36}.friend-actions .no{background:#6b2530}.friend-actions .later{background:#725a19}
    .composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;min-height:46px;max-height:140px;border:1px solid #3b5875;border-radius:12px;background:#0b1929;color:var(--text);padding:11px}
    .section{padding:16px}.search-row{display:flex;gap:8px;flex-wrap:wrap}.search-row input{flex:1 1 260px;border:1px solid #3b5875;border-radius:12px;background:#0b1929;color:var(--text);padding:11px}
    .results,.friends-list{display:grid;gap:10px;margin-top:14px}.person{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035)}
    .avatar{font-size:1.6rem;margin-right:8px}.status{margin-top:10px;color:var(--muted)}[hidden]{display:none!important}
    @media(max-width:760px){.messages-layout{grid-template-columns:1fr;min-height:0}.threads{border-right:none;border-bottom:1px solid var(--line);max-height:260px}.conversation{min-height:560px}.bubble{max-width:90%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">💬 Idesüss™ Üzenetek</div>
      <nav class="nav"><a href="/">← Főoldal</a><a href="/app/">▶ Webapp</a><a href="/radio/">📻 Rádió</a></nav>
    </header>

    <div class="tabs">
      <button id="messagesTab" class="tab active" type="button">Üzenetek</button>
      <button id="friendsTab" class="tab" type="button">Barátok</button>
    </div>

    <section id="authRequired" class="panel section" hidden>Az üzenetekhez jelentkezz be az Idesüss főoldalán.</section>

    <section id="messagesPanel" class="panel">
      <div class="messages-layout">
        <aside>
          <div class="threads" id="threadList"></div>
        </aside>
        <section class="conversation">
          <div id="conversationHead" class="conversation-head">Válassz beszélgetést</div>
          <div id="messageList" class="messages"><div class="muted">Itt jelennek meg a privát és rendszerüzenetek.</div></div>
          <div class="composer">
            <textarea id="messageInput" maxlength="4000" placeholder="Üzenet…" disabled></textarea>
            <button id="sendMessageBtn" class="action" type="button" disabled>Küldés</button>
          </div>
        </section>
      </div>
    </section>

    <section id="friendsPanel" class="panel section" hidden>
      <h2>Barátok</h2>
      <p class="muted">Keress becenév alapján. E-mail címre itt szándékosan nem lehet keresni.</p>
      <div class="search-row">
        <input id="friendSearchInput" type="search" autocomplete="off" placeholder="Becenév…" />
        <button id="friendSearchBtn" class="action" type="button">Keresés</button>
      </div>
      <div id="friendSearchStatus" class="status"></div>
      <div id="friendSearchResults" class="results"></div>
      <h3>Kapcsolataim</h3>
      <div id="friendshipsList" class="friends-list"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./messages.js?v=20260923-social1"></script>
</body>
</html>
